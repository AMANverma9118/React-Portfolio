    <script>
      (function () {
        try {
          var t = localStorage.getItem("aman-portfolio-theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.classList.add(t);
        } catch (e) {}
      })();
    </script>
